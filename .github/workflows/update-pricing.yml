name: Update model pricing

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-model-pricing
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'thomasiverson/octogon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.PRICING_PUSH_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Synchronize pricing from GitHub Docs
        run: node scripts/update-model-pricing.mjs

      - name: Detect pricing changes
        id: changes
        shell: bash
        run: |
          if ! git diff --quiet -- pricing/model-pricing.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Validate pricing
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run test:unit -- --run test/cost.test.ts
          npm run test:pricing-updater

      - name: Commit updated pricing
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pricing/model-pricing.json
          git commit -m "chore(pricing): sync GitHub Copilot model rates"
          git pull --rebase origin main
          git push origin HEAD:main
